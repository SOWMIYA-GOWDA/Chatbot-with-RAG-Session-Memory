<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> Chat Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat-shell">
    <header class="chat-header">
      <div class="avatar">👩‍⚕️</div>
      <div class="header-text">
        <h1>Chat Bot</h1>
        <p class="subtitle">A friendly human-style assistant</p>
      </div>
    </header>

    <section id="chat" class="chat-window" aria-live="polite"></section>

    <form id="composer" class="composer" onsubmit="send(event)">
      <textarea id="msg" class="input" placeholder="Say something…"></textarea>
      <button type="submit" class="send-btn">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
